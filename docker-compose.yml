# Local development stack. Usage: cp .env.example .env && docker compose up --build
# Production uses Tiger Cloud and Temporal Cloud instead of the postgres/temporal services.

services:
  postgres:
    build: ./infra/postgres          # PostgreSQL 17 + TimescaleDB + pgvector
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vendorwake_owner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-owner}
      POSTGRES_DB: ${POSTGRES_DB:-vendorwake}
      VW_APP_DB_PASSWORD: ${VW_APP_DB_PASSWORD:-change-me-app}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  temporal:
    image: temporalio/temporal:latest  # dev server: gRPC 7233, UI 8233
    # The image runs as uid 1000 (temporal); its home dir is the only path it owns, so the volume mounts there.
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--db-filename", "/home/temporal/temporal.db"]
    ports:
      - "127.0.0.1:7233:7233"
      - "127.0.0.1:8233:8233"
    volumes:
      - temporaldata:/home/temporal

  migrate:
    build: ./backend
    command: ["alembic", "upgrade", "head"]
    env_file: .env
    environment:
      VW_MIGRATION_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-vendorwake_owner}:${POSTGRES_PASSWORD:-change-me-owner}@postgres:5432/${POSTGRES_DB:-vendorwake}
      # Migration 0002 sets the vendorwake_worker role's password from this.
      VW_WORKER_DB_PASSWORD: ${VW_WORKER_DB_PASSWORD:-change-me-worker}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: ./backend
    env_file: .env
    environment:
      VW_DATABASE_URL: postgresql+psycopg://vendorwake_app:${VW_APP_DB_PASSWORD:-change-me-app}@postgres:5432/${POSTGRES_DB:-vendorwake}
      VW_TEMPORAL_ADDRESS: temporal:7233
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    # Combined image: includes git, the Entire CLI and tools/entire-agent-vendorwake for the Entire step.
    build:
      context: .
      dockerfile: backend/Dockerfile.worker
    command: ["python", "-m", "vendorwake.worker"]
    env_file: .env
    environment:
      VW_DATABASE_URL: postgresql+psycopg://vendorwake_app:${VW_APP_DB_PASSWORD:-change-me-app}@postgres:5432/${POSTGRES_DB:-vendorwake}
      # Role created by migration 0002; its password is set from VW_WORKER_DB_PASSWORD when `migrate` runs.
      VW_WORKER_DATABASE_URL: postgresql+psycopg://vendorwake_worker:${VW_WORKER_DB_PASSWORD:-change-me-worker}@postgres:5432/${POSTGRES_DB:-vendorwake}
      VW_TEMPORAL_ADDRESS: temporal:7233
    stop_grace_period: 30s
    depends_on:
      migrate:
        condition: service_completed_successfully
      temporal:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    env_file: .env
    environment:
      API_BASE_URL: http://api:8000   # server-side calls inside the compose network
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
  temporaldata:
