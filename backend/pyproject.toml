[project]
name = "vendorwake"
version = "0.1.0"
description = "Upstream-to-impact dependency intelligence: detect vendor changes and map them to your code."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.11",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pgvector>=0.5.1",
    "pyjwt[crypto]>=2.10",
    "httpx>=0.28",
    "sentry-sdk[fastapi]>=2.73",
    "packaging>=24",
    "backboard-sdk==1.5.19",
    "websockets>=13",
    "temporalio>=1.34",
    "fastembed>=0.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vendorwake"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs the docker-compose Postgres (VW_DATABASE_URL / VW_MIGRATION_DATABASE_URL)",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]
